name: electro-tutor-local

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ET_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ET_KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:58081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:58081:8080"
    volumes:
      - electro-tutor-keycloak:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "no"

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: electro_tutor
      POSTGRES_USER: electro_tutor_bootstrap
      POSTGRES_PASSWORD: local-bootstrap-only
      ET_DB_MIGRATOR_PASSWORD: local-migration-only
      ET_DB_RUNTIME_PASSWORD: local-runtime-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - electro-tutor-postgres:/var/lib/postgresql/data
      - ./services/api/docker/init-db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electro_tutor_bootstrap -d electro_tutor"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"

  api:
    image: electro-tutor-local-api
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      ET_ENVIRONMENT: local
      ET_HOST: 127.0.0.1
      ET_PORT: 8000
      ET_DOCS_ENABLED: "true"
      ET_DATABASE_URL: postgresql+asyncpg://electro_tutor_runtime:local-runtime-only@postgres:5432/electro_tutor
      ET_OIDC_BACKCHANNEL_BASE_URL: http://keycloak:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"

  migrate:
    image: electro-tutor-local-api
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      ET_ENVIRONMENT: local
      ET_MIGRATION_DATABASE_URL: postgresql+asyncpg://electro_tutor_migrator:local-migration-only@postgres:5432/electro_tutor
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "electro_tutor_api.cli", "db-migrate"]
    restart: "no"

volumes:
  electro-tutor-postgres:
    name: electro-tutor-local-postgres
  electro-tutor-keycloak:
    name: electro-tutor-local-keycloak
