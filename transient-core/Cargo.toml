[package]
name = "transient-core"
version = "0.1.0"
edition = "2021"
description = "Bounded-state transmission-line transient solver for Electro Tutor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
