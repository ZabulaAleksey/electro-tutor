name: Deploy Electro Tutor to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://zabulaaleksey.github.io
  BASE_PATH: /electro-tutor/

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.23.1
          cache: true
          install: false

      - name: Setup uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend API and PostgreSQL gates
        run: pnpm run backend:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start reproducible Chromium
        run: |
          core=$(node -p "require('node:path').dirname(require.resolve('playwright-core/package.json', {paths:[require.resolve('playwright',{paths:[require.resolve('@playwright/test')]})]}))")
          docker run --detach --name electro-tutor-ci-chromium --init --ipc=host \
            --publish 127.0.0.1:49301:3000 \
            --mount "type=bind,src=$core,dst=/opt/playwright-core,readonly" \
            --user pwuser \
            mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e \
            node /opt/playwright-core/cli.js run-server --port 3000 --host 0.0.0.0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:49301/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs electro-tutor-ci-chromium
          exit 1

      - name: Run required quality gates
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:49301/
        run: pnpm run verify:full -- --skip-install

      - name: Stop owned Chromium
        if: always()
        run: |
          if docker container inspect electro-tutor-ci-chromium >/dev/null 2>&1; then
            docker rm --force electro-tutor-ci-chromium
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
